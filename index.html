<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoa Hoa Kỳ</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e8f5e9;
}

.hero{
    height:320px;
    background:url("banner.jpg") center center/cover no-repeat;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    overflow:visible;
    z-index:1;
}

.card{
    max-width:480px;
    margin:-80px auto 30px;
    background:#fff;
    border-radius:20px;
    padding:90px 20px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    position:relative;
    z-index:2;
}

.avatar{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid #fff;
    position:absolute;
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:999;
}
h1{
    margin:10px 0 5px;
    text-align:center;
}

p{
    color:#555;
    text-align:center;
}

a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px; /* Tạo khoảng cách giữa icon và chữ */
    text-decoration: none;
    background: #2e7d32;
    color: #fff;
    padding: 14px;
    margin: 12px 0;
    border-radius: 14px;
    font-weight: bold;
    transition: all 0.25s ease;
    box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2); /* Tạo bóng nhẹ cho nút */
}

a.btn:active {
    background: #1b5e20;
    transform: translateY(-5px); /* Nhấn vào sẽ dịch chuyển lên rõ rệt hơn */
    box-shadow: 0 2px 5px rgba(46, 125, 50, 0.3);
}

</style>

</head>

<body>

<div class="hero"></div>

<div class="card">

    <img class="avatar" src="avatar.jpg" alt="Avatar">

    <h1>
    Khoa Hoa Kỳ 
    <span class="verified-badge" title="Đã xác thực">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#2e7d32" style="vertical-align: middle; margin-left: 4px;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.99 14.59-4.24-4.24 1.41-1.41 2.83 2.83 7.07-7.07 1.41 1.41-8.48 8.48z"/>
        </svg>
    </span>
</h1>


    <p>Chia sẻ kỹ thuật • Tăng năng suất • Giảm chi phí</p>

</div>

</body>
</html>
