<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoa Hoa Kỳ</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e8f5e9;
}

.hero{
    height:360px; /* Tăng nhẹ chiều cao để banner thoáng hơn */
    background:url("banner.jpg") center center/cover no-repeat;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    overflow:visible;
    z-index:1;
}

.card{
    max-width:480px;
    width:92%; /* Giúp card không bị sát viền màn hình điện thoại nhỏ */
    margin:-70px auto 30px;
    background:#fff;
    border-radius:20px;
    padding:90px 20px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    position:relative;
    z-index:2;
    box-sizing: border-box;
}

.avatar{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid #fff;
    position:absolute;
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:999;
}

/* ĐÃ CẬP NHẬT: Định dạng lại thẻ tiêu đề và dấu tích cho cân đối */
.title-verified {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0 5px;
    font-size: 24px;
}

/* ĐÃ CẬP NHẬT: Tăng kích thước dấu tích và căn chỉnh thẳng hàng tuyệt đối */
.title-verified::after {
    content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="%232e7d32"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.99 14.59-4.24-4.24 1.41-1.41 2.83 2.83 7.07-7.07 1.41 1.41-8.48 8.48z"/></svg>');
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
    transform: translateY(2px);
}

p{
    color:#555;
    text-align:center;
}

a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    background: #2e7d32;
    color: #fff;
    padding: 14px;
    margin: 12px 0;
    border-radius: 14px;
    font-weight: bold;
    transition: all 0.25s ease;
    box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
}

a.btn:active {
    background: #1b5e20;
    transform: scale(0.97); /* Hiệu ứng lún nhẹ khi chạm vào trên điện thoại */
    box-shadow: 0 2px 5px rgba(46, 125, 50, 0.3);
}
/* ===== TIÊU ĐỀ ỨNG DỤNG ===== */
.section-title {
    text-align: center;
    margin: 28px 0 8px;
    font-size: 15px;
    font-weight: 600;
    color: #2e7d32;
    letter-spacing: 0.5px;
}

.section-title::before,
.section-title::after {
    content: "";
    display: inline-block;
    width: 36px;
    height: 1px;
    background: #a5d6a7;
    vertical-align: middle;
    margin: 0 10px;
}
</style>

</head>

<body>

<div class="hero"></div>

<div class="card">

    <img class="avatar" src="avatar.jpg" alt="Avatar">

    <!-- ĐÃ CẬP NHẬT: Thêm class "title-verified" vào đây -->
    <h1 class="title-verified">
        Khoa Hoa Kỳ 
    </h1>

    <p>Chia sẻ kỹ thuật • Tăng năng suất • Giảm chi phí</p>
